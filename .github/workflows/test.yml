name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # الخلفية تتطلب فهرساً وGPU/نموذجاً: في CI نتحقق من سلامة الترجمة فقط
      - run: python -m compileall -q backend
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # مثبّت على الإصدار المختبَر: 3.50 أهمل package:flutter/material.dart (ترحيل مؤجّل، انظر README)
          flutter-version: 3.47.8
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
